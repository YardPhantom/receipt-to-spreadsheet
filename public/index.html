<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receipt to Spreadsheet</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>Receipt to Spreadsheet</h1><p>Upload a text/PDF receipt or paste OCR text and get CSV line items — client-side heuristic.</p></header>
<main><section><textarea id="in" placeholder="Paste OCR text from a receipt..."></textarea><br><button id="go">Extract items</button><button id="sample" class="alt">Load sample</button><button id="dl" class="alt">Download CSV</button><br><br><input type="file" id="file" accept=".txt,.pdf,image/*"></section><section id="out"><div class="card"><em>Results appear here.</em></div></section></main>
<footer>Built by <a href="https://trevorheshka.com">Trevor Heshka</a> · runs 100% in your browser</footer><script src="app.js"></script></body></html>
